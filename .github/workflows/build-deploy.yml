# 构建与部署工作流
# 构建 Docker 镜像推送到 GHCR，通过 SSH 部署到多云服务器
#
# 触发条件:
#   仅手动触发 (workflow_dispatch) → 选择目标
#
# GitHub 配置步骤:
#   在 Settings → Environments 中创建两个环境:
#     - aliyun-production
#     - aws-production
#   每个环境中配置对应 Secrets:
#     ALIYUN_HOST / ALIYUN_USER / ALIYUN_PATH / ALIYUN_SSH_KEY
#     AWS_HOST    / AWS_USER    / AWS_PATH    / AWS_SSH_KEY
#
# 注意: 迁移由 Docker CMD 自动执行 (node migrate.mjs)，无需 CI 单独处理
# 注意: 阿里云 ECS 自建 Postgres 需用宿主 IP 而非 localhost，详见 README

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'aliyun'
        type: choice
        options: [aliyun, aws, both]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 预处理：确定部署目标 ====================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      deploy_aliyun: ${{ steps.targets.outputs.deploy_aliyun }}
      deploy_aws: ${{ steps.targets.outputs.deploy_aws }}
      git_ref: ${{ steps.targets.outputs.git_ref }}

    steps:
      - name: Determine deploy targets
        id: targets
        run: |
          target="${{ github.event.inputs.target }}"

          deploy_aliyun=false
          deploy_aws=false

          case "$target" in
            aliyun) deploy_aliyun=true ;;
            aws)    deploy_aws=true ;;
            both)   deploy_aliyun=true; deploy_aws=true ;;
          esac

          echo "deploy_aliyun=${deploy_aliyun}" >> "$GITHUB_OUTPUT"
          echo "deploy_aws=${deploy_aws}" >> "$GITHUB_OUTPUT"
          echo "git_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Show plan
        run: |
          echo "### 部署计划" >> "$GITHUB_STEP_SUMMARY"
          echo "| 目标 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 阿里云 ECS | ${{ steps.targets.outputs.deploy_aliyun == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS EC2    | ${{ steps.targets.outputs.deploy_aws == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ==================== 构建并推送到 GHCR ====================
  build:
    name: Build & Push
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}
      image_app: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ steps.info.outputs.git_hash }}
      image_nginx: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:${{ steps.info.outputs.git_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - name: Normalize image name
        id: repo
        run: echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Generate build info
        id: info
        run: |
          echo "git_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:buildcache,mode=max

      - name: Extract nginx metadata
        id: nginx-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: nginx
          tags: ${{ steps.nginx-meta.outputs.tags }}
          labels: ${{ steps.nginx-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:buildcache,mode=max

  # ==================== 部署到阿里云 ECS ====================
  deploy-aliyun:
    name: Deploy → 阿里云 ECS
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_aliyun == 'true'
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: aliyun-production
      registry: ghcr.io
      actor: ${{ github.actor }}
      image_app: ${{ needs.build.outputs.image_app }}
      image_nginx: ${{ needs.build.outputs.image_nginx }}
      git_ref: ${{ needs.prepare.outputs.git_ref }}
    secrets:
      HOST: ${{ secrets.ALIYUN_HOST }}
      USER: ${{ secrets.ALIYUN_USER }}
      DEPLOY_PATH: ${{ secrets.ALIYUN_PATH }}
      SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 部署到 AWS EC2 ====================
  deploy-aws:
    name: Deploy → AWS EC2
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_aws == 'true'
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: aws-production
      registry: ghcr.io
      actor: ${{ github.actor }}
      image_app: ${{ needs.build.outputs.image_app }}
      image_nginx: ${{ needs.build.outputs.image_nginx }}
      git_ref: ${{ needs.prepare.outputs.git_ref }}
    secrets:
      HOST: ${{ secrets.AWS_HOST }}
      USER: ${{ secrets.AWS_USER }}
      DEPLOY_PATH: ${{ secrets.AWS_PATH }}
      SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 汇总通知 ====================
  notify:
    name: Notify
    needs: [prepare, build, deploy-aliyun, deploy-aws]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result != 'skipped'

    steps:
      - name: Summary
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 阶段 | 状态 |"
            echo "|------|------|"
            echo "| 构建 & 推送 | ${{ needs.build.result }} |"
            echo "| 阿里云 ECS  | ${{ needs.deploy-aliyun.result }} |"
            echo "| AWS EC2     | ${{ needs.deploy-aws.result }} |"
            echo ""
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "**App 镜像**: \`${{ needs.build.outputs.image_app }}\`"
              echo ""
              echo "**Nginx 镜像**: \`${{ needs.build.outputs.image_nginx }}\`"
              echo ""
              echo "**构建时间**: ${{ needs.build.outputs.build_time }}"
            fi
            if [[ "${{ needs.deploy-aliyun.result }}" == "failure" || "${{ needs.deploy-aws.result }}" == "failure" ]]; then
              echo ""
              echo "> **部署失败** — manage.sh 若检测到健康检查失败会自动回滚到上一版本"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
