# 构建与部署工作流
# 构建 Docker 镜像推送到 GHCR，通过 SSH 部署到多云服务器
#
# 触发条件:
#   1. Check Quality 成功后自动触发 (workflow_run) → 仅部署阿里云
#   2. 推送 v* tag 时触发 (发版) → 部署阿里云 + AWS
#   3. 手动触发 (workflow_dispatch) → 选择目标
#
# GitHub 配置步骤:
#   在 Settings → Environments 中创建两个环境:
#     - aliyun-production
#     - aws-production
#   每个环境中配置对应 Secrets:
#     ALIYUN_HOST / ALIYUN_USER / ALIYUN_PATH / ALIYUN_SSH_KEY
#     AWS_HOST    / AWS_USER    / AWS_PATH    / AWS_SSH_KEY
#
# 注意: 迁移由 Docker CMD 自动执行 (node migrate.mjs)，无需 CI 单独处理
# 注意: 阿里云 ECS 自建 Postgres 需用宿主 IP 而非 localhost，详见 README

name: Build and Deploy

on:
  workflow_run:
    workflows: ["Check Quality"]
    branches: [main, master]
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'aliyun'
        type: choice
        options: [aliyun, aws, both]

concurrency:
  group: build-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 预处理：确定部署目标 ====================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      deploy_aliyun: ${{ steps.targets.outputs.deploy_aliyun }}
      deploy_aws: ${{ steps.targets.outputs.deploy_aws }}
      git_ref: ${{ steps.targets.outputs.git_ref }}

    steps:
      - name: Determine deploy targets
        id: targets
        run: |
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"
          target="${{ github.event.inputs.target }}"

          deploy_aliyun=false
          deploy_aws=false

          if [[ "$event" == "push" && "$ref" == refs/tags/v* ]]; then
            # 正式发版 tag → 两个云都部署
            deploy_aliyun=true
            deploy_aws=true
          elif [[ "$event" == "workflow_run" ]]; then
            # main/master 日常推送 → 仅阿里云
            deploy_aliyun=true
          elif [[ "$event" == "workflow_dispatch" ]]; then
            case "$target" in
              aliyun) deploy_aliyun=true ;;
              aws)    deploy_aws=true ;;
              both)   deploy_aliyun=true; deploy_aws=true ;;
            esac
          fi

          echo "deploy_aliyun=${deploy_aliyun}" >> "$GITHUB_OUTPUT"
          echo "deploy_aws=${deploy_aws}" >> "$GITHUB_OUTPUT"

          # 确定正确的 git ref（workflow_run 事件需取 head_sha）
          if [[ "$event" == "workflow_run" ]]; then
            echo "git_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "git_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show plan
        run: |
          echo "### 部署计划" >> "$GITHUB_STEP_SUMMARY"
          echo "| 目标 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 阿里云 ECS | ${{ steps.targets.outputs.deploy_aliyun == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS EC2    | ${{ steps.targets.outputs.deploy_aws == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ==================== 构建并推送到 GHCR ====================
  build:
    name: Build & Push
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}
      image_app: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ steps.info.outputs.git_hash }}
      image_nginx: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:${{ steps.info.outputs.git_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - name: Normalize image name
        id: repo
        run: echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Generate build info
        id: info
        run: |
          echo "git_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract nginx metadata
        id: nginx-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: nginx
          tags: ${{ steps.nginx-meta.outputs.tags }}
          labels: ${{ steps.nginx-meta.outputs.labels }}

  # ==================== 部署到阿里云 ECS ====================
  deploy-aliyun:
    name: Deploy → 阿里云 ECS
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_aliyun == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-aliyun
      cancel-in-progress: false  # 部署不允许被取消，避免服务处于中间状态
    environment:
      name: aliyun-production

    steps:
      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - name: Check secrets
        run: |
          has_error=0
          for var in ALIYUN_HOST ALIYUN_USER ALIYUN_PATH ALIYUN_SSH_KEY; do
            eval "val=\${$var:-}"
            if [[ -z "$val" ]]; then
              echo "::error::缺少 ${var} secret（在 aliyun-production Environment 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PATH: ${{ secrets.ALIYUN_PATH }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          source: "manage.sh,docker-compose.yml,nginx.conf,.env.example"
          target: ${{ secrets.ALIYUN_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.ALIYUN_PATH }}"
            IMAGE_APP="${{ needs.build.outputs.image_app }}"
            IMAGE_NGINX="${{ needs.build.outputs.image_nginx }}"

            cd "${DEPLOY_PATH}"
            chmod +x ./manage.sh

            # 登录 GHCR（GITHUB_TOKEN 仅在本次工作流有效）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # 拉取新镜像并部署（manage.sh 内含健康检查和自动回滚）
            # 注意：迁移由 Docker CMD 在容器启动时自动执行 (node migrate.mjs)
            ./manage.sh pull-deploy "${IMAGE_APP}" "${IMAGE_NGINX}"

  # ==================== 部署到 AWS EC2 ====================
  deploy-aws:
    name: Deploy → AWS EC2
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_aws == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    environment:
      name: aws-production

    steps:
      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - name: Check secrets
        run: |
          has_error=0
          for var in AWS_HOST AWS_USER AWS_PATH AWS_SSH_KEY; do
            eval "val=\${$var:-}"
            if [[ -z "$val" ]]; then
              echo "::error::缺少 ${var} secret（在 aws-production Environment 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PATH: ${{ secrets.AWS_PATH }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "manage.sh,docker-compose.yml,nginx.conf,.env.example"
          target: ${{ secrets.AWS_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.AWS_PATH }}"
            IMAGE_APP="${{ needs.build.outputs.image_app }}"
            IMAGE_NGINX="${{ needs.build.outputs.image_nginx }}"

            cd "${DEPLOY_PATH}"
            chmod +x ./manage.sh

            # 登录 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # 拉取新镜像并部署
            # DATABASE_URL 指向 RDS endpoint，在服务器 .env 中配置
            # 迁移由 Docker CMD 在容器启动时自动执行 (node migrate.mjs)
            ./manage.sh pull-deploy "${IMAGE_APP}" "${IMAGE_NGINX}"

  # ==================== 汇总通知 ====================
  notify:
    name: Notify
    needs: [prepare, build, deploy-aliyun, deploy-aws]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result != 'skipped'

    steps:
      - name: Summary
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 阶段 | 状态 |"
            echo "|------|------|"
            echo "| 构建 & 推送 | ${{ needs.build.result }} |"
            echo "| 阿里云 ECS  | ${{ needs.deploy-aliyun.result }} |"
            echo "| AWS EC2     | ${{ needs.deploy-aws.result }} |"
            echo ""
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "**App 镜像**: \`${{ needs.build.outputs.image_app }}\`"
              echo ""
              echo "**Nginx 镜像**: \`${{ needs.build.outputs.image_nginx }}\`"
              echo ""
              echo "**构建时间**: ${{ needs.build.outputs.build_time }}"
            fi
            if [[ "${{ needs.deploy-aliyun.result }}" == "failure" || "${{ needs.deploy-aws.result }}" == "failure" ]]; then
              echo ""
              echo "> **部署失败** — manage.sh 若检测到健康检查失败会自动回滚到上一版本"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
