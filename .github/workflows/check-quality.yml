name: Check Quality

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node-modules-cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - id: cache-key
        run: echo "value=node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: node_modules
          key: ${{ steps.cache-key.outputs.value }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.node-modules-cache-key }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.node-modules-cache-key }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: t3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/t3_test
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.node-modules-cache-key }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:coverage

  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      SKIP_ENV_VALIDATION: 1
      BETTER_AUTH_SECRET: ci-e2e-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_METHOD: email-password
      ADMIN_EMAILS: e2e-admin@test.local
      E2E_ADMIN_EMAIL: e2e-admin@test.local
      E2E_ADMIN_PASSWORD: E2e-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.node-modules-cache-key }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec tsx scripts/seed-admin.ts "$E2E_ADMIN_EMAIL" "$E2E_ADMIN_PASSWORD" "E2E Admin"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.node-modules-cache-key }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm build
