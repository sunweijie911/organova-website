# HTTPS 入口（仅 AWS 部署叠加 docker-compose.https.yml 时生效）
# 与 nginx.conf 并存：
#   - nginx.conf 提供 80 catch-all server（server_name _），承担 IP 直连/健康检查等流量
#   - 本文件下面这个 80 server 用具体 server_name organova.bio 抢占域名访问，强制 301 跳转
#     （nginx 路由优先级：具体 server_name > catch-all _）
#   - 本文件的 443 server 提供 SSL 终端 + 业务
# 这样：
#   - http://organova.bio/* → 301 → https://organova.bio/*（强制 HTTPS）
#   - http://<IP>/api/health → 仍走 nginx.conf 的 80 catch-all 业务，健康检查不受影响

# HTTP → HTTPS 强制跳转（仅对正式域名生效）
server {
    listen 80;
    server_name organova.bio;
    return 301 https://$host$request_uri;
}

# HTTPS 业务
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/organova.bio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/organova.bio/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    # Docker 内部 DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js 构建产物 - 长期缓存
    location ^~ /_next/static/ {
        alias /usr/share/nginx/static/;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 上传文件
    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # public 目录静态资源
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|mp4|webm|woff2?|ttf|eot)$ {
        root /usr/share/nginx/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    set $upstream http://organova-app:3000;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @nextjs {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
