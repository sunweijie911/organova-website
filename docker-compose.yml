services:
  organova-app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  organova-nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      organova-app:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: organova
    # PG18+ 要求挂在 /var/lib/postgresql（让镜像自己在子目录建版本化目录），
    # 不再支持直接挂 /var/lib/postgresql/data。详见 docker-library/postgres#1259
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  uploads_data:
