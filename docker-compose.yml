services:
  organova-app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/public/uploads

  organova-nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - organova-app

  db:
    image: postgres:16
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: organova
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data:
